name: Patch oauth logging
on:
  push:
    branches:
      - fix/oauth-log-diagnostic
permissions:
  contents: write
concurrency:
  group: patch-oauth-log
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply one-line logging patch to server.mjs
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('apps/command/server.mjs')
          s = p.read_text()
          old = "if (!response.ok) throw new HttpError(401, 'Discord sign-in failed. Start again.');"
          new = "if (!response.ok) { console.error(`[oauth] token exchange failed: ${response.status} ${await response.text().catch(() => 'body-unavailable')}`); throw new HttpError(401, 'Discord sign-in failed. Start again.'); }"
          count = s.count(old)
          assert count == 1, f'expected 1 match, found {count}'
          p.write_text(s.replace(old, new))
          print('patched ok')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "littlebird-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/command/server.mjs
          git diff --cached --quiet && echo "already patched; nothing to commit" && exit 0
          git commit -m "Log Discord token-exchange failure body for diagnosis"
          git push
