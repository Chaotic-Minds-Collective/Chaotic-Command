name: Apply token proxy patch v3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify patched file
        run: |
          curl -fsSL -o /tmp/server_proxy3.mjs https://h.uguu.se/fcFiPuGj.mjs
          echo "5df6a71007a787cc02415c922781e1bcb101aaefb15970722dcf7026814cce32  /tmp/server_proxy3.mjs" | sha256sum -c -
      - name: Rebase branch onto main and commit
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B fix/oauth-token-proxy origin/main
          cp /tmp/server_proxy3.mjs apps/command/server.mjs
          git add apps/command/server.mjs
          git commit -m "Validate DISCORD_TOKEN_PROXY requires HTTPS, fall back to direct endpoint otherwise"
          git push --force origin fix/oauth-token-proxy
      - name: Self-disarm (remove this workflow from main)
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/apply-token-proxy-3.yml
          git commit -m "Remove one-shot patch workflow v3"
          git push origin main
