name: Patch discord user agent
on:
  push:
    branches:
      - fix/discord-user-agent
permissions:
  contents: write
concurrency:
  group: patch-discord-ua
  cancel-in-progress: false
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add User-Agent to Discord API calls
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('apps/command/server.mjs')
          s = p.read_text()
          UA = "ChaoticCommand/1.0 (+https://command.chaoticmindsgaming.com)"
          old1 = "headers: { Authorization: token, ...(options.body ? { 'Content-Type': 'application/json' } : {}), ...options.headers }"
          new1 = "headers: { Authorization: token, ...(options.body ? { 'Content-Type': 'application/json' } : {}), 'User-Agent': '" + UA + "', ...options.headers }"
          old2 = "headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({"
          new2 = "headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'User-Agent': '" + UA + "' }, body: new URLSearchParams({"
          assert s.count(old1) == 1, f'old1 count {s.count(old1)}'
          assert s.count(old2) == 1, f'old2 count {s.count(old2)}'
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s)
          print('patched both call sites ok')
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "littlebird-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/command/server.mjs
          git diff --cached --quiet && echo "already patched; nothing to commit" && exit 0
          git commit -m "Add User-Agent to Discord API calls (fix Cloudflare 1015 on token exchange)"
          git push
