name: Apply OAuth 429 retry patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify patched file
        run: |
          curl -fsSL -o /tmp/server_patched.mjs https://h.uguu.se/OQSLYHQb.mjs
          echo "f3ff44bb92dce89c85db3a07993fa8d99f7cfc9628a05868494b54bfa609c585  /tmp/server_patched.mjs" | sha256sum -c -
      - name: Commit patch to branch
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b fix/oauth-token-429-retry
          cp /tmp/server_patched.mjs apps/command/server.mjs
          git add apps/command/server.mjs
          git commit -m "Retry Discord token exchange on 429 (matches discord() helper behavior)"
          git push origin fix/oauth-token-429-retry
      - name: Self-disarm (remove this workflow from main)
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/apply-oauth-429-retry.yml
          git commit -m "Remove one-shot patch workflow"
          git push origin main
