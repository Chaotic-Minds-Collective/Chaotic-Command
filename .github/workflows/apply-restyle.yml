name: Apply command-center restyle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify files
        run: |
          cd /tmp
          curl -fsSL -o idx.gz https://d.uguu.se/gUuLvqPF.mjs
          curl -fsSL -o style.css https://d.uguu.se/SovbOUML.mjs
          curl -fsSL -o app.js https://n.uguu.se/WFmuZBBS.mjs
          gunzip -c idx.gz > index.html
          echo "2289ed3181144441ecd1f5e76ac65fa5ac06d557fcb56a587fa55baa6e23c057  index.html" | sha256sum -c -
          echo "fb2af500ed6f5157da25ac10b4edf65805f5781bef21054d19bf0cd32105e2c0  style.css" | sha256sum -c -
          echo "c9f5ebcd3f20a9b0e306e065bb16e417283b2d4d9014ce2bb8001243f5271813  app.js" | sha256sum -c -
      - name: Commit restyled files
        run: |
          cp /tmp/index.html apps/command/web/index.html
          cp /tmp/style.css apps/command/web/style.css
          cp /tmp/app.js apps/command/web/app.js
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git add apps/command/web/index.html apps/command/web/style.css apps/command/web/app.js
          git commit -m "Restyle command center: real tabs, lighter panels, cyan accents; add dashboard, monetization, staff panels"
          git push origin feature/command-center-restyle
      - name: Remove this workflow from the branch
        run: |
          git rm .github/workflows/apply-restyle.yml
          git commit -m "Remove one-shot restyle workflow"
          git push origin feature/command-center-restyle
